general {
    lock_cmd = pidof hyprlock || hyprlock          # nie odpalaj drugiej blokady
    before_sleep_cmd = loginctl lock-session       # zablokuj przed uśpieniem (np. zamknięcie klapy)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false                    # film na YouTube/Spotify blokuje wygaszanie
}

# 5 min: przyciemnij ekran laptopa
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min: blokada
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: wyłącz monitory
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
