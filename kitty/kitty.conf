# shell
shell /usr/bin/fish

# font
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13

# okno
window_padding_width 3 7
hide_window_decorations no
background_opacity 0.7
background #000000

# kursor
cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait -1

# kolory (plik generowany osobno, patrz niżej)
include colors.conf
