# mpv — wideo i muzyka (domyślny odtwarzacz w mimeapps.list)
hwdec=auto-safe              # dekodowanie sprzętowe (VA-API na iGPU Intela)
vo=gpu-next
keep-open=yes                # nie zamykaj po końcu filmu
save-position-on-quit=yes    # wznów od miejsca zakończenia
volume-max=150
screenshot-directory=~/Obrazy
screenshot-template=mpv-%F-%P
slang=pl,pol,en,eng          # napisy: najpierw polskie
alang=pl,pol,en,eng,ja,jpn
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
sub-font-size=42
