# Matugen — nie edytuj ręcznie
[mgr]
cwd = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
find_keyword = { fg = "#{{colors.tertiary.default.hex_stripped}}", bold = true, italic = true }
find_position = { fg = "#{{colors.secondary.default.hex_stripped}}", italic = true }
marker_copied = { fg = "#{{colors.secondary.default.hex_stripped}}", bg = "#{{colors.secondary.default.hex_stripped}}" }
marker_cut = { fg = "#{{colors.error.default.hex_stripped}}", bg = "#{{colors.error.default.hex_stripped}}" }
marker_marked = { fg = "#{{colors.tertiary.default.hex_stripped}}", bg = "#{{colors.tertiary.default.hex_stripped}}" }
marker_selected = { fg = "#{{colors.primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}" }
count_copied = { fg = "#{{colors.on_secondary.default.hex_stripped}}", bg = "#{{colors.secondary.default.hex_stripped}}" }
count_cut = { fg = "#{{colors.on_error.default.hex_stripped}}", bg = "#{{colors.error.default.hex_stripped}}" }
count_selected = { fg = "#{{colors.on_primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}" }
border_symbol = "│"
border_style = { fg = "#{{colors.outline_variant.default.hex_stripped}}" }

[tabs]
active = { fg = "#{{colors.on_primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}", bold = true }
inactive = { fg = "#{{colors.on_surface_variant.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }

[mode]
normal_main = { fg = "#{{colors.on_primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}", bold = true }
normal_alt = { fg = "#{{colors.primary.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }
select_main = { fg = "#{{colors.on_secondary.default.hex_stripped}}", bg = "#{{colors.secondary.default.hex_stripped}}", bold = true }
select_alt = { fg = "#{{colors.secondary.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }
unset_main = { fg = "#{{colors.on_tertiary.default.hex_stripped}}", bg = "#{{colors.tertiary.default.hex_stripped}}", bold = true }
unset_alt = { fg = "#{{colors.tertiary.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }

[indicator]
parent = { fg = "#{{colors.on_surface.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }
current = { fg = "#{{colors.on_primary.default.hex_stripped}}", bg = "#{{colors.primary.default.hex_stripped}}", bold = true }
preview = { underline = true }

[status]
perm_type = { fg = "#{{colors.primary.default.hex_stripped}}" }
perm_read = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
perm_write = { fg = "#{{colors.error.default.hex_stripped}}" }
perm_exec = { fg = "#{{colors.secondary.default.hex_stripped}}" }
perm_sep = { fg = "#{{colors.outline.default.hex_stripped}}" }
progress_label = { fg = "#{{colors.on_surface.default.hex_stripped}}", bold = true }
progress_normal = { fg = "#{{colors.primary.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }
progress_error = { fg = "#{{colors.error.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }

[input]
border = { fg = "#{{colors.primary.default.hex_stripped}}" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#{{colors.primary.default.hex_stripped}}" }

[tasks]
border = { fg = "#{{colors.primary.default.hex_stripped}}" }
title = {}
hovered = { fg = "#{{colors.tertiary.default.hex_stripped}}", underline = true }

[which]
mask = { bg = "#{{colors.surface_container.default.hex_stripped}}" }
cand = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
rest = { fg = "#{{colors.outline.default.hex_stripped}}" }
desc = { fg = "#{{colors.secondary.default.hex_stripped}}" }
separator_style = { fg = "#{{colors.outline_variant.default.hex_stripped}}" }

[help]
on = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
run = { fg = "#{{colors.secondary.default.hex_stripped}}" }
hovered = { reversed = true, bold = true }
footer = { fg = "#{{colors.on_surface.default.hex_stripped}}", bg = "#{{colors.surface_container_high.default.hex_stripped}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "#{{colors.tertiary.default.hex_stripped}}" },
  { mime = "{audio,video}/*", fg = "#{{colors.secondary.default.hex_stripped}}" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#{{colors.error.default.hex_stripped}}" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#{{colors.on_surface_variant.default.hex_stripped}}" },
  { url = "*", is = "orphan", fg = "#{{colors.error.default.hex_stripped}}" },
  { url = "*", is = "exec", fg = "#{{colors.secondary.default.hex_stripped}}" },
  { url = "*/", fg = "#{{colors.primary.default.hex_stripped}}" },
]
