# Matugen — nie edytuj ręcznie
[[themes]]
name = "matugen"
[themes.palette]
background = "#{{colors.surface.default.hex_stripped}}"
foreground = "#{{colors.on_surface.default.hex_stripped}}"
black = "#{{colors.surface_container_lowest.default.hex_stripped}}"
red = "#{{colors.error.default.hex_stripped}}"
green = "#{{colors.primary.default.hex_stripped}}"
yellow = "#{{colors.tertiary.default.hex_stripped}}"
blue = "#{{colors.secondary.default.hex_stripped}}"
magenta = "#{{colors.tertiary.default.hex_stripped}}"
cyan = "#{{colors.primary.default.hex_stripped}}"
white = "#{{colors.on_surface.default.hex_stripped}}"
bright_black = "#{{colors.outline.default.hex_stripped}}"
bright_red = "#{{colors.error.default.hex_stripped}}"
bright_green = "#{{colors.primary_fixed.default.hex_stripped}}"
bright_yellow = "#{{colors.tertiary_fixed.default.hex_stripped}}"
bright_blue = "#{{colors.secondary_fixed.default.hex_stripped}}"
bright_magenta = "#{{colors.tertiary_fixed.default.hex_stripped}}"
bright_cyan = "#{{colors.primary_fixed.default.hex_stripped}}"
bright_white = "#ffffff"
[themes.component_style]
selection = { bg = "#{{colors.primary_container.default.hex_stripped}}", fg = "#{{colors.on_primary_container.default.hex_stripped}}", modifiers = ["Bold"] }
block_title = { fg = "#{{colors.primary.default.hex_stripped}}", modifiers = ["Bold"] }
border = { fg = "#{{colors.outline_variant.default.hex_stripped}}" }
playback_track = { fg = "#{{colors.primary.default.hex_stripped}}", modifiers = ["Bold"] }
playback_artists = { fg = "#{{colors.secondary.default.hex_stripped}}" }
playback_album = { fg = "#{{colors.tertiary.default.hex_stripped}}" }
playback_progress_bar = { bg = "#{{colors.surface_container_highest.default.hex_stripped}}", fg = "#{{colors.primary.default.hex_stripped}}" }
current_playing = { fg = "#{{colors.primary.default.hex_stripped}}", modifiers = ["Bold"] }
